name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo. Secrets are not exposed to
# pull_request runs from forks by GitHub default.
permissions:
  contents: read

jobs:
  go:
    name: build & test (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # The broker integration tests spawn a Node mock upstream (uses the MCP SDK).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install mock upstream deps
        working-directory: spike
        run: npm install --no-audit --no-fund

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1

      - name: Race test
        run: go test -race ./... -count=1

  site:
    name: validate static site metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate CLI page, metadata, JSON-LD, and sitemap
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path("site")
          home = (root / "index.html").read_text()
          cli = (root / "cli" / "index.html").read_text()
          sitemap = (root / "sitemap.xml").read_text()
          assert "JanusMCP — Multi-account CLI for AI agents and MCP clients" in home
          assert 'href="/cli/"' in home
          assert 'rel="canonical" href="https://janusmcp.dev/cli/"' in cli
          assert "https://janusmcp.dev/cli/" in sitemap
          for page in (home, cli):
              blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', page, re.S)
              assert blocks
              for block in blocks:
                  json.loads(block)
          PY

  documentation:
    name: validate documentation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate PR template and ADRs
        run: python3 scripts/check-docs.py

  npm-wrapper:
    name: test npm launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test native launcher contract
        working-directory: npm
        run: npm test
      - name: Validate package contents
        working-directory: npm
        run: npm pack --dry-run

  daemon-smoke-unix:
    name: daemon smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install mock upstream dependencies
        working-directory: spike
        run: npm install --no-audit --no-fund
      - name: Build and verify direct versus daemon reuse
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/janusmcp"
          (cd go && go build -o "$BIN" ./cmd/janusmcp)
          export JANUS_CONFIG="$PWD/spike/config.json"
          export JANUS_DAEMON_DIR="$RUNNER_TEMP/janusmcp-daemon"
          export JANUS_VAULT=file
          export JANUS_VAULT_DIR="$RUNNER_TEMP/janusmcp-vault"
          direct_a="$($BIN call instance_id --direct)"
          direct_b="$($BIN call instance_id --direct)"
          test "$direct_a" != "$direct_b"
          "$BIN" daemon start --port 17432
          trap '"$BIN" daemon stop || true' EXIT
          warm_a="$($BIN call instance_id --daemon)"
          warm_b="$($BIN call instance_id --daemon)"
          test "$warm_a" = "$warm_b"
          "$BIN" daemon status --json
          "$BIN" daemon stop
          trap - EXIT

  daemon-smoke-windows:
    name: daemon smoke (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install mock upstream dependencies
        working-directory: spike
        run: npm install --no-audit --no-fund
      - name: Build and verify direct versus daemon reuse
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Join-Path $env:RUNNER_TEMP "janusmcp.exe"
          Push-Location go
          go build -o $bin ./cmd/janusmcp
          Pop-Location
          $env:JANUS_CONFIG = (Resolve-Path "spike/config.json").Path
          $env:JANUS_DAEMON_DIR = Join-Path $env:RUNNER_TEMP "janusmcp-daemon"
          $env:JANUS_VAULT = "file"
          $env:JANUS_VAULT_DIR = Join-Path $env:RUNNER_TEMP "janusmcp-vault"
          $directA = (& $bin call instance_id --direct | Out-String).Trim()
          $directB = (& $bin call instance_id --direct | Out-String).Trim()
          if ($directA -eq $directB) { throw "direct mode unexpectedly reused an upstream" }
          & $bin daemon start --port 17432
          try {
            $warmA = (& $bin call instance_id --daemon | Out-String).Trim()
            $warmB = (& $bin call instance_id --daemon | Out-String).Trim()
            if ($warmA -ne $warmB) { throw "daemon mode did not reuse the upstream" }
            & $bin daemon status --json
          } finally {
            & $bin daemon stop
          }
